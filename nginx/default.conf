server {
    listen 80;
    server_name 192.168.178.165;

    # Root must be the SAME as what's in your PHP container
    root /var/www/html/backend/public;
    index index.php index.html;

    # 1. THE ADMIN FRONTEND
    location / {
        root /var/www/html/admin-web/dist;
        try_files $uri $uri/ /index.html;
    }

    # 2. THE API (Laravel)
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. THE PHP HANDLER (The fix for 502)
    location ~ \.php$ {
        # Check if 'php' matches your service name in docker-compose.yml
        fastcgi_pass php:9000; 
        fastcgi_index index.php;
        include fastcgi_params;
        
        # This tells PHP exactly where the file is
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        
        # Performance buffers
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }
}